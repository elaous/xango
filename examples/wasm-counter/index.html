<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>gojiberry wasm counter demo</title>
  <script src="wasm_exec.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((result) => {
      go.run(result.instance);
    });
  </script>
</body>
</html>
