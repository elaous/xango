<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>gojiberry Router demo</title>
  <script src="wasm_exec.js"></script>
</head>
<body>
  <button id="go-about">Go to /about</button>
  <button id="replace-home">Replace with /</button>

  <p id="content">(pending)</p>
  <p>Path: <span id="path-result">(pending)</span></p>

  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((result) => {
      go.run(result.instance);
    });
  </script>
</body>
</html>
