<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>gojiberry wasm canvas demo</title>
  <script src="wasm_exec.js"></script>
</head>
<body>
  <canvas id="c2d" width="100" height="100"></canvas>
  <canvas id="c3d" width="100" height="100"></canvas>
  <p>2D pixel (50,50): <span id="result2d">(pending)</span></p>
  <p>3D pixel (50,50): <span id="result3d">(pending)</span></p>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((result) => {
      go.run(result.instance);
    });
  </script>
</body>
</html>
